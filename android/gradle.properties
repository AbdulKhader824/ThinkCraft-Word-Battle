# Lowered from 8G: this laptop has 16 GB, and the emulator needs room too.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# The project is on D: but Flutter's package cache is on C:. Kotlin's
# incremental compiler fails across drives ("Could not close incremental
# caches"), so plugins are compiled in full instead. Builds are a little
# slower; the alternative is moving PUB_CACHE to D:.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
